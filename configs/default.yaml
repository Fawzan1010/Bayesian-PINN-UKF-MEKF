project:
  name: spacecraft_hybrid_estimator
  output_dir: outputs
  seed: 42
  device: cpu
  synthetic:
    dt: 1.0
    horizon: 240
    train_trajectories: 80
    val_trajectories: 20
    test_trajectories: 100
    monte_carlo_trials: 100
    scenarios: [quiet, maneuver, biased_sensors, high_disturbance, degraded_measurements, storm]
    include_range_doppler: true
  simulation:
    mu_earth: 398600.4418
    radius_earth: 6378.137
    j2: 1.08262668e-3
    cd: 2.2
    cr: 1.3
    area: 12.0
    mass: 920.0
    # Absolute epoch: required by NRLMSISE-00, ignored by the exponential model.
    epoch_utc: '2015-03-17T00:00:00Z'
    inertia: [[145.0, 0.0, 0.0], [0.0, 160.0, 0.0], [0.0, 0.0, 120.0]]
  measurement_noise:
    gyro: 0.0010
    accel: 0.020
    vector: 0.012
    gps_pos: 0.012
    gps_vel: 0.0008
    range: 0.02
    doppler: 0.0002
  process_noise:
    bg: 2.0e-5
    ba: 2.0e-4
    torque: 0.002
    accel: 0.01
  filter:
    ukf_alpha: 0.1
    ukf_beta: 2.0
    ukf_kappa: 0.0
    q_scale: 0.5
    r_scale: 2.0
  # PINN prior fused as a pseudo-measurement with
  # R_pinn = diag(predicted variance) * pinn_r_scale. Smaller = trust PINN more.
  # The convex-blend coupling applies only to the learning-only baselines.
  fusion:
    pinn_r_scale: 1.0
    coupling:
      PINN-only: 1.00
      Transformer-only: 1.00
  training:
    window: 8
    batch_size: 256
    # Long budget; early stopping on `patience` determines the real cutoff.
    pinn_epochs: 150
    transformer_epochs: 80
    lr: 0.001
    hidden: 128
    # H = 4 hidden layers with tanh activation.
    depth: 4
    activation: tanh
    lambda_norm: 0.1
    patience: 15
    model_dim: 64
    num_heads: 4
    num_layers: 2
  # python main.py --mode ablate
  ablation:
    seeds: [0, 1, 2]
    epochs: 15
    subset_train_trajectories: 40
    subset_test_trajectories: 20
    depth: [2, 4, 6]
    hidden: [64, 128, 256]
    window: [2, 4, 8]
    lr: [3.0e-4, 1.0e-3, 3.0e-3]
    lambda_norm: [0.0, 0.1, 1.0]
    pinn_r_scale: [0.25, 1.0, 4.0, 16.0]
    # Runtime is re-measured with repeats and the leading repeat discarded,
    # and an untimed warm-up call precedes the sweep, so the first
    # configuration no longer absorbs process initialisation.
    runtime_repeats: 3
    runtime_discard_first: 1
    pin_threads: 1
    # Evaluate the methods that cannot respond to any axis once, as a
    # reference: their spread bounds the measurement noise.
    check_invariance: true

  # Atmospheric density model.  'exponential' reproduces the original
  # behaviour exactly; 'nrlmsise00' evaluates NRLMSISE-00 through pymsis
  # using measured F10.7 / Ap from the OMNI2 record below.
  atmosphere:
    model: exponential
    space_weather_file: data/space_weather/omni2_2015.dat
    use_ap_history: true
    cache_seconds: 60.0
    rho0: 3.614e-13
    scale_height_km: 88.0
    reference_altitude_km: 400.0

  # Runtime measurement.  Methods are interleaved inside the repeat loop and
  # the leading repeat is discarded as warm-up.
  benchmark:
    repeats: 5
    discard_first: 1
    n_trajectories: 3
    pin_threads: 1

  # Historical storm evaluation: python main.py --mode storm
  # Every trained model is reused as-is; nothing is retrained or retuned.
  storm_experiment:
    date: '2015-03-17'
    # The window must span the disturbed period, not the quiet hours before
    # it.  On 17 Mar 2015 ap = 7 until 03:00 UTC, rises through 39/67/56, and
    # reaches 179 at 12:00; Dst falls to its annual minimum of -234 nT at
    # 22:00.  09:00-15:00 covers the ap 56 -> 179 jump and the onset of the
    # main phase, so the arc contains a large activity gradient rather than a
    # constant level.
    start_utc: '2015-03-17T09:00:00Z'
    duration_hours: 6.0
    # dt matches the training configuration exactly, so the reused networks
    # see inputs sampled as they were during training.
    dt: 1.0
    n_trajectories: 2
    altitude_km: 500.0
    scenario: historical_storm
    # 'mismatched' = truth NRLMSISE-00 while the filters keep the exponential
    # model (unmodelled density error, the primary comparison).
    # 'matched'    = both truth and filters use NRLMSISE-00.
    pairings: [mismatched, matched]
    # Real Ap is mapped onto the weather_index range the networks were trained
    # on so the reused models stay in distribution; ap_raw is the
    # out-of-distribution sensitivity check.
    weather_index_mode: normalized
    weather_index_ap_scale: 100.0
    weather_index_max: 1.6